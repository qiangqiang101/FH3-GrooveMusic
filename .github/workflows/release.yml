name: Release

# Builds GrooveMusicRadio.dll and attaches GrooveMusicRadio-<tag>.zip (extract next to azimuth.exe) to
# the release. Run it by hand (Actions > Release > Run workflow) for a test build; the zip is then an
# artifact of the run.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LLVM-MinGW
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') {
            throw 'LLVM-MinGW archive checksum mismatch'
          }
          Expand-Archive $archive $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'llvm-mingw-20261020-ucrt-x86_64/bin' >> $env:GITHUB_PATH

      - name: Build
        shell: bash
        run: |
          mod="dist/package/mods/Forza Horizon 3/GrooveMusicRadio"
          mkdir -p "$mod/plugins"
          sh build.sh "$mod/plugins/GrooveMusicRadio.dll"
          cp GrooveMusicRadio.ini "$mod/"

      - name: Package
        shell: pwsh
        run: |
          $tag = if ('${{ github.event.release.tag_name }}') { '${{ github.event.release.tag_name }}' } else { 'dev' }
          $zip = "dist/GrooveMusicRadio-$tag.zip"
          Compress-Archive -Path dist/package/mods -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: GrooveMusicRadio
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ZIP" --clobber --repo "${{ github.repository }}"
